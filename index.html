<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestione Ore</title><style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#07101e;color:#eaf2ff;font:16px system-ui}main{text-align:center}i{display:block;width:38px;height:38px;margin:0 auto 16px;border:3px solid #2388ff;border-top-color:transparent;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><main><i></i>Carico Gestione Ore…</main><script>const b='https://raw.githubusercontent.com/DDavid80/gestione-ore/main/';Promise.all(['dashboard-part-1.txt','dashboard-part-2.txt'].map(p=>fetch(b+p+'?v=6',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.text()}))).then(a=>{document.open();document.write(a.join(''));document.close()}).catch(()=>document.body.innerHTML='<main>Impossibile caricare la dashboard. Ricarica la pagina.</main>')</script></body></html>
